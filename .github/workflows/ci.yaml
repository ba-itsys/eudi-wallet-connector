name: Validate Config

on:
  pull_request:
    branches:
      - 'main'
  workflow_dispatch: { }

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Check shell scripts
        run: |
          for script in scripts/*.sh; do
            sh -n "$script"
          done

      - name: Validate base realm JSON
        run: jq empty config/realm-wallet-connector-base.json

      - name: Generate local realm JSON
        run: scripts/setup-local-realm.sh --local-wallet

      - name: Validate generated realm JSON
        run: jq empty generated/realm-wallet-connector-local.json

      - name: Test realm generation modes
        run: sh tests/setup-local-realm-test.sh

      - name: Validate Docker Compose config
        run: docker compose config

  # Note: The name `automerge-check` is configured in the ruleset (repo settings) as a required merge check
  automerge-check:
    runs-on: ubuntu-latest
    needs: [ validate ]
    if: always()
    steps:
      - name: Verify all jobs succeeded
        run: |
          results="${{ needs.validate.result }}"
          echo "Job results: $results"
          for result in $results; do
            if [ "$result" != "success" ]; then
              echo "At least one job did not succeed"
              exit 1
            fi
          done
          echo "All jobs succeeded"
